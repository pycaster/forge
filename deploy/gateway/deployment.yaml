apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-gateway
  labels:
    app.kubernetes.io/name: agent-gateway
    app.kubernetes.io/component: gateway
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-gateway
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-gateway
        app.kubernetes.io/component: gateway
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: gateway
        image: ghcr.io/pycaster/agent-platform:configure-release
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: agent-gateway-config
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        env:
        - name: TELEGRAM_BOT_TOKEN
          valueFrom:
            secretKeyRef:
              name: agent-gateway-credentials
              key: TELEGRAM_BOT_TOKEN
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 32Mi
